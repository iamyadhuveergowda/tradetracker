name: Mistral Desk (advisory, shadow)

# SHADOW of the Gemini desk: same triggers, separate script + output
# files + concurrency group, so both desks judge every batch independently.
# Two triggers (push primary, 5-minute polling backup):
#  * push on signals/latest.json — primary. Every agent publish starts a
#    run within ~a minute.
#  * schedule every 5 min in the NIFTY session window — backup / polling
#    cadence. Cron "*/5 3-10 * * 1-5" UTC = 08:30-16:25 IST Mon-Fri, covering
#    the 09:15-15:30 IST session with buffer. A run that finds the batch
#    already judged exits in seconds with no Gemini call and no commit.
# Marking done: the script dedupes by signal_id (desk_history_mistral.json), so
# re-pushes, cron re-runs and manual re-runs never judge the same batch
# twice. The workflow commits verdict AND history with [skip ci], so its
# own commit does not retrigger it, and the concurrency group queues
# overlapping runs instead of cancelling them — no double judging.
# NOTE for future wire-in: desk_verdict_mistral.json is already machine-readable
# ({signal_id, judged_at, verdicts: [{ticker, action, verdict, confidence,
# entry, stop, target, ...}]}), so a future agent build could poll it by
# signal_id and wait — but that agent-side wait/gate is NOT in this package
# and is NOT enabled by this workflow change. The desk stays advisory-only
# until its track record proves good, per the Oct 23 decision.
on:
  push:
    branches: [main]
    paths:
      - 'signals/latest.json'
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nifty-desk-mistral
  cancel-in-progress: false

jobs:
  run-analyst-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The desk script is stdlib-only: no dependencies to install.
      - name: Judge all candidates
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/assistant_desk_mistral.py
      - name: Commit verdict AND history
        run: |
          git config --global user.name "Assistant Desk Bot"
          git config --global user.email "bot@users.noreply.github.com"
          for f in desk_verdict_mistral.json desk_history_mistral.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No desk changes to commit"
          else
            git commit -m "Auto: Mistral desk verdict update [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed; retrying..."
              sleep 5
              if [ "$attempt" = "3" ]; then echo "ERROR: push failed after 3 attempts" >&2; exit 1; fi
            done
          fi
