name: EOD Assistant Desk Ledger

on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate-eod-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openai requests yfinance
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/eod_summary.py
      - name: Commit cleared daily history
        run: |
          git config --global user.name "Assistant Desk Bot"
          git config --global user.email "bot@users.noreply.github.com"
          if [ -f desk_history.json ]; then
            git add desk_history.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Clear EOD history [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "desk_history.json not found, skipping commit."
          fi
