name: EOD Summary (fixed)

# 10:15 UTC = 15:45 IST, after the 15:30 NSE close. The script scores the
# day's desk verdicts against post-signal price action and writes the
# outcomes back into desk_history.json — the commit below persists the
# SCORED history. (The previous workflow's job was committing a wiped,
# empty history file.)
on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nifty-eod
  cancel-in-progress: false

jobs:
  generate-eod-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install yfinance
      - name: Compute EOD stats, score desk verdicts, notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/eod_summary.py
      - name: Commit scored desk history
        run: |
          git config --global user.name "Assistant Desk Bot"
          git config --global user.email "bot@users.noreply.github.com"
          if [ -f desk_history.json ]; then
            git add desk_history.json
            if git diff --staged --quiet; then
              echo "No scoring changes to commit"
            else
              git commit -m "Auto: EOD desk outcomes scored [skip ci]"
              for attempt in 1 2 3; do
                if git pull --rebase origin main && git push origin HEAD:main; then
                  break
                fi
                git rebase --abort 2>/dev/null || true
                echo "Push attempt $attempt failed; retrying..."
                sleep 5
                if [ "$attempt" = "3" ]; then echo "ERROR: push failed after 3 attempts" >&2; exit 1; fi
              done
            fi
          else
            echo "desk_history.json not found, skipping commit."
          fi
