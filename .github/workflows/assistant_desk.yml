name: Assistant Desk (advisory, fixed)

# Two triggers (push primary, 5-minute polling backup):
#  * push on signals/latest.json — primary. Every agent publish starts a
#    run within ~a minute.
#  * schedule every 5 min in the NIFTY session window — backup / polling
#    cadence. Cron "*/5 3-10 * * 1-5" UTC = 08:30-15:30 IST Mon-Fri, covering
#    the 09:15-15:30 IST session with buffer. A run that finds the batch
#    already judged exits in seconds with no Gemini call and no commit.
# Marking done: the script dedupes by signal_id (desk_history.json), so
# re-pushes, cron re-runs and manual re-runs never judge the same batch
# twice. The workflow commits verdict AND history with [skip ci], so its
# own commit does not retrigger it, and the concurrency group queues
# overlapping runs instead of cancelling them — no double judging.
# NOTE for future wire-in: desk_verdict.json is already machine-readable
# ({signal_id, judged_at, verdicts: [{ticker, action, verdict, confidence,
# entry, stop, target, ...}]}), so a future agent build could poll it by
# signal_id and wait — but that agent-side wait/gate is NOT in this package
# and is NOT enabled by this workflow change. The desk stays advisory-only
# until its track record proves good, per the Oct 23 decision.
on:
  push:
    paths:
      - 'signals/latest.json'
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nifty-desk
  cancel-in-progress: false

jobs:
  run-analyst-desk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The desk script is stdlib-only: no dependencies to install.
      - name: Judge all candidates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/assistant_desk.py
      - name: Commit verdict AND history
        run: |
          git config --global user.name "Assistant Desk Bot"
          git config --global user.email "bot@users.noreply.github.com"
          for f in desk_verdict.json desk_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No desk changes to commit"
          else
            git commit -m "Auto: Assistant desk verdict update [skip ci]"
            git pull --rebase origin main
            git push
          fi
