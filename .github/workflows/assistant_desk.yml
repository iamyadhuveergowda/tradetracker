name: Assistant Desk Multi-Analyst Pipeline

on:
  push:
    paths:
      - 'signals/latest.json'
  workflow_dispatch:

jobs:
  run-analyst-desk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai requests

      - name: Run Multi-Analyst Chain & Generate Verdict
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/assistant_desk.py

      - name: Commit and Push Verdict
        run: |
          git config --global user.name "Assistant Desk Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add desk_verdict.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Assistant desk verdict update [skip ci]"
          git pull --rebase origin main
          git push
