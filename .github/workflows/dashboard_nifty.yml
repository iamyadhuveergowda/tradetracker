name: NIFTY Dashboard Rebuild

# Rebuilds index.html from the repo's own JSON after anything the page renders
# has changed. This is what keeps the dashboard alive: the agent's own sync
# step writes its own index.html today, but once the agent-side follow-up
# patch lands (see AGENT_CHANGE_NOTE.md) the agent will push data only, and
# this workflow becomes the sole writer of index.html.
#
# Triggers:
#  * push on any data file the page reads (including the agent's own index.html
#    until the agent patch lands — after that, index.html only changes here)
#  * push on market_nifty.json, once the agent publishes it
#  * a 10-min safety net across NIFTY hours, in case a push run is missed
#
# No [skip ci] here on purpose would retrigger this workflow forever, so the
# commit message carries it. index.html is excluded from the path filter for
# the same reason.
#
# Schedule note: cron "*/10 3-10 * * 1-5" UTC = 08:30-16:20 IST Mon-Fri,
# covering the 09:15-15:30 IST session with buffer (same window as the
# assistant-desk workflow). The NIFTY market is closed Sat/Sun, so there
# are no weekend runs.
on:
  push:
    branches: [main]
    paths:
      - "trades/**"
      - "signals/**"
      - "desk_history.json"
      - "desk_history_mistral.json"
      - "desk_verdict.json"
      - "desk_verdict_mistral.json"
      - "earnings_calendar_nifty.json"
      - "market_nifty.json"
      - "index.html"
      - "build_dashboard.py"
      - ".github/workflows/dashboard_nifty.yml"
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nifty-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.html
        run: |
          python3 build_dashboard.py
          echo "generated $(wc -c < index.html) bytes"

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Dashboard already up to date"
            exit 0
          fi
          git commit -m "dashboard: rebuild from repo data [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
            if [ "$attempt" = "3" ]; then echo "ERROR: push failed after 3 attempts" >&2; exit 1; fi
          done
